name: Build

# Builds and tests the RPM, AppImage and Flatpak on every PR and push to main.
# - auto/update-claude (dispatched weekly by fork-check-update.yml): merge when green.
# - main, with a version that has no GitHub release yet (or no Pages site): sign the
#   packages, publish the release, and publish the dnf and Flatpak repos on Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_ID: io.github.celso_alexandre.ClaudeDesktop

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      claude: ${{ steps.v.outputs.claude }}
      build_tag: ${{ steps.v.outputs.build_tag }}
      tag: ${{ steps.v.outputs.tag }}
      rev: ${{ steps.v.outputs.rev }}
      publish: ${{ steps.v.outputs.publish }}
      # Pinned by digest in fork/fedora-image; fork/check-update.sh moves it with each release
      fedora: ${{ steps.v.outputs.fedora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every build below depends on this: Anthropic's signature over the index that lists the pin
      - name: Pinned .deb is in Anthropic's signed index
        run: fork/official-index.sh verify-pins
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.PKG_GPG_KEY_ID != '' }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          CLAUDE=$(grep -oP "^OFFICIAL_DEB_VERSION='\K[^']+" scripts/setup/official-deb.sh)
          WRAPPER=$(grep -oPm1 '^## \[v\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          # fork/revision: bumped when this fork's packaging changes without a new Claude version
          REV=$(cat fork/revision)
          TAG="claude-$CLAUDE-$WRAPPER-$REV"
          {
            echo "fedora=$(cat fork/fedora-image)"
            echo "claude=$CLAUDE"
            # build.sh reads the packaging (wrapper) version from this upstream-style tag
            echo "build_tag=v$WRAPPER+claude$CLAUDE"
            echo "tag=$TAG"
            echo "rev=$REV"
          } >> "$GITHUB_OUTPUT"
          # Merges done by automerge below arrive as workflow_dispatch, not push
          [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ] || exit 0

          if [ "$HAS_KEY" != true ]; then
            echo "::warning::PKG_GPG_KEY_ID is not set; nothing is published"
          elif ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            ! curl -fsSIo /dev/null "$SITE/claude-desktop.repo"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y bats nodejs
      # Upstream's suites for its own workflows and triage bot are left out: those
      # workflows are not part of this fork
      - run: |
          bats --print-output-on-failure $(ls tests/*.bats scripts/cowork-fallback/tests/*.bats |
            grep -vE '/(ci-|workflow-|triage-)')
      - run: ./tools/chromium-switch-smoke.sh

  rpm:
    needs: meta
    runs-on: ubuntu-24.04
    container: ${{ needs.meta.outputs.fedora }}
    env:
      # Anthropic's app.asar unmodified: no upstream asar patches, no npm at build time
      CLAUDE_OFFICIAL_ASAR: "1"
      FORK_REVISION: ${{ needs.meta.outputs.rev }}
    steps:
      # Fedora's signed nodejs: build.sh then needs no Node download
      - run: dnf install -y git findutils nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./build.sh --build rpm --arch amd64 --release-tag "${{ needs.meta.outputs.build_tag }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm
          path: claude-desktop-unofficial-*.rpm
          if-no-files-found: error
          compression-level: 0

  appimage:
    needs: meta
    runs-on: ubuntu-24.04
    env:
      # Anthropic's app.asar unmodified: no upstream asar patches, no npm at build time
      CLAUDE_OFFICIAL_ASAR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
      # GITHUB_REPOSITORY points the embedded zsync update info at this fork's releases
      - run: ./build.sh --build appimage --arch amd64 --release-tag "${{ needs.meta.outputs.build_tag }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: |
            claude-desktop-unofficial-*.AppImage
            claude-desktop-unofficial-*.AppImage.zsync
          if-no-files-found: error
          compression-level: 0

  flatpak:
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.meta.outputs.fedora }}
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          dnf install -y flatpak flatpak-builder binutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build "fork/flatpak/$APP_ID.yml"
          flatpak build-bundle repo "claude-desktop-${{ needs.meta.outputs.claude }}-x86_64.flatpak" \
            "$APP_ID" stable --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error
          compression-level: 0

  # Installed the way a user would, then launched: upstream's package checks and smoke test
  rpm-test:
    needs: [meta, rpm]
    runs-on: ubuntu-24.04
    container: ${{ needs.meta.outputs.fedora }}
    env:
      # Anthropic's app.asar unmodified: no upstream asar patches, no npm at build time
      CLAUDE_OFFICIAL_ASAR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm
          path: artifacts/
      # The rpm declares no runtime Requires (AutoReqProv: no); these are Electron's libraries
      - run: |
          dnf install -y findutils file nodejs npm shadow-utils binutils cpio xz \
            xorg-x11-server-Xvfb xdotool dbus-daemon util-linux procps-ng \
            nss nspr atk at-spi2-atk at-spi2-core cups-libs gtk3 \
            libdrm mesa-libgbm alsa-lib libX11 libXcomposite libXdamage \
            libXext libXfixes libXrandr libxcb libxkbcommon pango cairo \
            libXScrnSaver libXtst libxshmfence
      - env:
          TARGET_ARCH: amd64
        run: bash tests/test-artifact-rpm.sh artifacts/
      - name: Anthropic's files ship byte for byte
        run: |
          mkdir x && (cd x && rpm2cpio ../artifacts/*.rpm | cpio -id --quiet)
          fork/verify-official-app.sh x/usr/lib/claude-desktop-unofficial \
            --extra launcher-common.sh --extra doctor.sh

  appimage-test:
    needs: appimage
    runs-on: ubuntu-24.04
    env:
      # Anthropic's app.asar unmodified: no upstream asar patches, no npm at build time
      CLAUDE_OFFICIAL_ASAR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage
          path: artifacts/
      - run: |
          sudo apt-get update
          sudo apt-get install -y file libfuse2 nodejs npm xvfb xdotool dbus-x11 procps
      - env:
          TARGET_ARCH: amd64
        run: bash tests/test-artifact-appimage.sh artifacts/
      - name: Anthropic's files ship byte for byte
        run: |
          chmod +x artifacts/*.AppImage && artifacts/*.AppImage --appimage-extract >/dev/null
          app=$(dirname "$(dirname "$(find squashfs-root -path '*/resources/app.asar' | head -1)")")
          fork/verify-official-app.sh "$app" --extra launcher-common.sh --extra doctor.sh

  flatpak-test:
    needs: [meta, flatpak]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.meta.outputs.fedora }}
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak
      - name: Install
        run: |
          dnf install -y flatpak xorg-x11-server-Xvfb xdotool ImageMagick dbus-daemon util-linux procps-ng shadow-utils
          flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y --noninteractive "claude-desktop-${{ needs.meta.outputs.claude }}-x86_64.flatpak"
      # As a regular user, like a desktop session: Electron refuses to run sandboxed as root
      - name: Smoke test
        run: |
          useradd -m smoke
          install -d -m 700 -o smoke /tmp/xdg-smoke
          runuser -u smoke -- env XDG_RUNTIME_DIR=/tmp/xdg-smoke SMOKE_SCREENSHOT=/tmp/smoke-flatpak.png \
            dbus-run-session -- fork/smoke-test.sh flatpak run "$APP_ID"
      - if: always()
        run: cp /tmp/smoke-flatpak.png . || true
      - name: Anthropic's files ship byte for byte
        run: |
          dnf install -y binutils xz
          fork/verify-official-app.sh "$(flatpak info --show-location "$APP_ID")/files/lib/claude-desktop" \
            --missing chrome-sandbox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshot-flatpak
          path: smoke-flatpak.png

  automerge:
    needs: [bats, rpm-test, appimage-test, flatpak-test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/auto/update-claude'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # --match-head-commit: never merge a commit other than the one just tested
          gh pr merge "$BRANCH" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
          # A merge made with GITHUB_TOKEN fires no push event, so start main's run (which publishes)
          gh workflow run fork-build.yml -R "$GITHUB_REPOSITORY" --ref main

  publish:
    needs: [meta, bats, rpm-test, appimage-test, flatpak-test]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    container: ${{ needs.meta.outputs.fedora }}
    permissions:
      contents: write
    steps:
      - run: dnf install -y git gh gnupg2 rpm-sign createrepo_c flatpak ostree
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{rpm,appimage,flatpak}"
          merge-multiple: true
          path: dist/
      - name: Sign and assemble the repos
        env:
          GPG_KEY: ${{ secrets.PKG_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.PKG_GPG_KEY_ID }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          fork/site.sh dist "${{ needs.meta.outputs.tag }}" "$KEY_ID" site
      # Before Pages: the dnf metadata points at these release assets
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          CLAUDE: ${{ needs.meta.outputs.claude }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Claude Desktop $CLAUDE" \
              --notes "Claude Desktop $CLAUDE, repacked from Anthropic's official Linux .deb.

          Automatic updates: add the dnf or Flatpak repo (see README), or keep the AppImage current with Gear Lever / AppImageUpdate. One-off installs: the files below."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*.rpm dist/*.AppImage dist/*.zsync dist/*.flatpak
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
